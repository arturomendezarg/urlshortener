# Dependency scanning (security quality gate, see ARCHITECTURE.md section 11 and
# AI_USAGE_LOG.md). Dependabot was chosen over OWASP Dependency-Check as a Maven
# plugin: Dependency-Check depends on the NVD API, which without a registered API key
# applies an aggressive rate limit (seconds of wait per request) and can make the CI job
# slow or unstable — a poor fit for a pipeline that must run on every PR of a
# time-boxed exercise. Dependabot is native to GitHub, requires no additional
# infrastructure configuration, and covers the same goal (alerting on dependencies with
# known vulnerabilities).
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
