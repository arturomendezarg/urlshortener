name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: '**/*.md'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Maven project
        id: check_pom
        run: |
          if [ -f "pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check_pom.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Checkstyle y OWASP Dependency-Check quedan integrados como plugins de Maven
      # ligados a la fase `verify` una vez exista pom.xml (Día 1) — no requieren un
      # step de CI aparte, corren dentro de este mismo `mvn verify`.
      - name: Build and run tests (mvn verify)
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn -B clean verify

      - name: Skip build (no Maven project yet)
        if: steps.check_pom.outputs.exists == 'false'
        run: echo "No se encontró pom.xml todavía — se omite build/test. Esperado en la fase actual (solo documentación); este job se activa solo al llegar el scaffold del Día 1."
