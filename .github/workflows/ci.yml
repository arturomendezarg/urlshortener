name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: '**/*.md'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Maven project
        id: check_pom
        run: |
          if [ -f "pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check_pom.outputs.exists == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Checkstyle and OWASP Dependency-Check are integrated as Maven plugins
      # bound to the `verify` phase once pom.xml exists (Day 1) — they don't require a
      # separate CI step, they run within this same `mvn verify`.
      - name: Build and run tests (mvn verify)
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn -B clean verify

      - name: Skip build (no Maven project yet)
        if: steps.check_pom.outputs.exists == 'false'
        run: echo "pom.xml not found yet — skipping build/test. Expected at the current phase (documentation only); this job only activates once the Day 1 scaffold lands."
