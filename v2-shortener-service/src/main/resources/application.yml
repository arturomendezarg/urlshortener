server:
  port: 8084

spring:
  application:
    name: v2-shortener-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/urlshortener}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short, bounded connect/command timeout: the whole point of the Circuit Breaker
      # (see ShortLinkCache) is that a Redis outage must fail FAST so the fallback to
      # PostgreSQL kicks in quickly instead of the redirect path hanging.
      timeout: 300ms
      connect-timeout: 300ms

app:
  shortlink:
    # Reserved slugs that can never be assigned as a customAlias (ARCHITECTURE.md, section 5).
    reserved-slugs: api,admin,health,actuator
    # TTL (seconds) of a cached short link entry. Bounds how long a change made directly in
    # PostgreSQL (e.g. deactivating a link) can take to be reflected on the redirect path while
    # the cache entry is still warm. A plain number, not a Duration literal like "5m": kept as
    # seconds so it binds cleanly via a simple @Value(long) without relying on Spring's Duration
    # string-conversion rules applying to @Value the same way they do to @ConfigurationProperties.
    cache-ttl-seconds: 300
    base-url: ${SHORTLINK_BASE_URL:http://localhost:8084}
    # Hard cap on how many lines a single POST /api/v2/urls/bulk submission may contain
    # (ARCHITECTURE.md, section 5: rate limiting/abuse mitigation is Task #11's own item, but an
    # unbounded array in one request is a separate, cheap-to-close abuse vector worth closing
    # now rather than leaving it open until then).
    bulk-max-items: 500
  messaging:
    bulk-url-jobs-queue: bulk-url-jobs
  ratelimit:
    # Redis-backed fixed-window counters (ARCHITECTURE.md, section 5/8, Task #11) guarding
    # against a single authenticated caller creating short links faster than these thresholds.
    # Keyed per JWT subject, not per client IP: both endpoints already require a valid token, so
    # the abuse case worth mitigating is a compromised or malicious authenticated caller
    # hammering creation, not an anonymous flood these endpoints never accept anyway.
    create-url:
      limit: 30
      window-seconds: 60
    bulk-create:
      # Much lower than create-url: one call here can create up to
      # app.shortlink.bulk-max-items short links, so the effective link-creation throughput this
      # still allows per window is far higher than the single-create endpoint's own limit.
      limit: 5
      window-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      redis:
        # Applies to the Redis-only calls in ShortLinkCache, never to the PostgreSQL fallback
        # itself (see ARCHITECTURE.md, section 6, Scenario A: the AI's first draft only handled
        # cache-miss, not Redis being unreachable — this Circuit Breaker is the fix).
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        slow-call-duration-threshold: 300ms
        slow-call-rate-threshold: 50
        # RateLimiter.checkLimit's normal "over the limit" outcome is a
        # RateLimitExceededException, not a Redis failure -- excluded so it is never recorded as
        # a circuit-breaker failure nor routed to RateLimiter's fallback (which would otherwise
        # silently let a rate-limited caller through). See RateLimiter's own Javadoc.
        ignore-exceptions:
          - com.artmendez.urlshortener.v2.ratelimit.RateLimitExceededException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
