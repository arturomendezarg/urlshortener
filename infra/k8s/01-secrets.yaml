# Kubernetes Secrets holding the exact same non-real, dev-only placeholder credentials already
# declared in docker-compose.yml and ARCHITECTURE.md section 8.2 ("todas las contraseñas de
# Postgres/RabbitMQ/Keycloak ... son valores de desarrollo local inventados, con default en el
# propio archivo -- no hay secreto real que proteger en este ejercicio"). Using the Secret object
# (rather than a plain ConfigMap) here is about using the right K8s primitive for
# credential-shaped values, not about protecting anything actually sensitive -- these are the
# identical strings anyone can already read in docker-compose.yml or this repo's git history.
#
# stringData (plain text) instead of hand-computed base64 in `data`: kubectl/the API server does
# the base64 encoding at apply time, so these values stay directly comparable to
# docker-compose.yml's own `environment:` blocks instead of being an opaque blob only decodable
# with `kubectl get secret -o jsonpath ... | base64 -d`.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: url-shortener
type: Opaque
stringData:
  POSTGRES_DB: urlshortener
  POSTGRES_USER: urlshortener
  POSTGRES_PASSWORD: urlshortener_local
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: url-shortener
type: Opaque
stringData:
  # Deliberately NOT "guest": RabbitMQ's loopback_users restriction rejects the default guest
  # user for any connection that isn't from the broker's own loopback interface, which a
  # different pod's connection never is (see AI_USAGE_LOG.md, PR #20 and PR #26's
  # RabbitMQContainer.withUser(...) entries for the same restriction hit in Testcontainers).
  # docker-compose.yml already works around this the same way, with the same values.
  RABBITMQ_USER: urlshortener
  RABBITMQ_PASSWORD: urlshortener_local
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: url-shortener
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin_local
