apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-processor
  namespace: url-shortener
  labels:
    app: bulk-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bulk-processor
  template:
    metadata:
      labels:
        app: bulk-processor
    spec:
      containers:
        - name: bulk-processor
          image: bulk-processor:kind
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            # bulk-processor never runs its own Liquibase in production (see its pom.xml's own
            # comment: liquibase-core is test-only there) -- it assumes v2-shortener-service's
            # migrations already created bulk_jobs/bulk_job_items/short_links. Both Deployments
            # point at the same Postgres, so whichever of the two pods' Liquibase-owning startup
            # finishes first lays down the schema; this is the same "shared database, one
            # migration owner" shape already exercised whenever this project's services are run
            # together outside Testcontainers (docker-compose + `mvn spring-boot:run` locally).
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          # A slow start is not a hang, and initialDelaySeconds cannot tell them apart: it
          # picks one fixed number that is either too short (the container is killed while
          # still booting) or too long (a real hang goes undetected for that whole window).
          # startupProbe is the mechanism for exactly this -- it holds readiness and liveness
          # off until the app answers once, then hands over to them unchanged and strict.
          # 30 x 10s = up to 5 minutes to boot, which a JVM sharing a single-node cluster with
          # four other JVMs, Postgres, Redis, RabbitMQ and Keycloak genuinely needs.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ClusterIP only -- same reasoning as analytics-worker's Service above: bulk-processor is a
# bulk-url-jobs consumer, submissions come in through v2-shortener-service's
# POST /api/v2/urls/bulk, never directly against this pod.
apiVersion: v1
kind: Service
metadata:
  name: bulk-processor
  namespace: url-shortener
spec:
  selector:
    app: bulk-processor
  ports:
    - port: 8085
      targetPort: 8085
