# The ConfigMap this Deployment mounts (keycloak-realm-import, holding realm-export.json) is NOT
# defined in this file. It is generated by infra/k8s/deploy-to-kind.sh directly from
# infra/keycloak/realm-export.json -- the exact same file docker-compose.yml already mounts into
# Keycloak the same way -- instead of a hand-copied duplicate of its JSON living inside this YAML
# that could silently drift from the source file. Run that script (or its
# "kubectl create configmap keycloak-realm-import --from-file=... --dry-run=client -o yaml |
# kubectl apply -f -" line by itself) before applying this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: url-shortener
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN_PASSWORD
            # The one deliberate divergence from docker-compose.yml's Keycloak config, and the
            # reason it has to exist here: docker-compose works with Keycloak's default
            # request-based hostname resolution because both a human/Postman AND the resource
            # server (v2-shortener-service, run directly on the Codespace host in that setup)
            # reach Keycloak through the exact same URL (http://localhost:8081/...), so whatever
            # `iss` claim it stamps on a token always matches what the resource server expects.
            # Inside this cluster that stops being true: v2-shortener-service reaches Keycloak
            # via the Service DNS name "keycloak" (see 22-v2-shortener-service.yaml's
            # KEYCLOAK_ISSUER_URI), but an external caller (Postman, curl) reaches it through
            # kind's extraPortMapping on localhost:8081 instead -- two different URLs for the
            # same server. Fixing KC_HOSTNAME to a plain hostname makes Keycloak's hostname v2
            # provider stamp that SAME canonical URL as `iss` on every token regardless of which
            # of those two URLs a client actually used to request it, so the resource server's
            # issuer check keeps matching no matter who asked for the token.
            - name: KC_HOSTNAME
              value: keycloak
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /realms/urlshortener
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /realms/urlshortener
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 8
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: url-shortener
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      # Fixed, not auto-assigned: infra/k8s/kind-config.yaml's extraPortMappings maps the host's
      # localhost:8081 to this exact nodePort (containerPort in that file), matching
      # docker-compose.yml's own 8081 mapping for Keycloak -- picking it deliberately here is
      # what makes that mapping possible at all, since kind's extraPortMappings has to name a
      # specific port up front, at cluster-creation time, not "whatever NodePort got assigned".
      nodePort: 30081
  type: NodePort
