openapi: 3.0.3
info:
  title: URL Shortener - API V2
  version: "2.0.0"
  description: >
    REST contract of the V2 (modern) URL shortening system. Defined first, before
    the implementation (Day 1, Task #4 of the plan), to validate the API design
    with the team before writing business and persistence code.

    See ARCHITECTURE.md for full context:
      - Section 3.1 (Components) and section 6, Scenario A: why this contract exists and
        which microservices implement it (Shortener Service, Bulk Processor, Analytics
        Worker) in the coming days of the plan.
      - Section 4.1: prose summary of these same endpoints.
      - Section 4.2: underlying data model (`short_links`, `app_user`, `click_events`,
        `bulk_jobs`, `bulk_job_items`).
      - Section 5: security (OAuth2/OIDC via Keycloak, Resource Server).
      - Section 6, Scenario C: origin of `redirectRules` (simple conditional redirect by
        device type) and `expiresAt` (410 Gone once expired).

    Out of scope for this contract: `GET /{shortCode}` (the real public redirect) does not
    live under `/api/v2` — the public domain is single and stable (Strangler Fig pattern,
    section 3.1) and is resolved by the API Gateway, checking the V2 index first and then
    Monolith V1. It is documented in the Gateway itself, not here.
servers:
  - url: /api/v2
    description: Through the API Gateway (single entry point, Strangler Fig pattern)

security:
  - bearerAuth: []

tags:
  - name: urls
    description: Short URL management (creation, listing, revocation, analytics)
  - name: bulk
    description: Asynchronous bulk creation (via RabbitMQ, bulk-url-jobs queue)

paths:
  /urls:
    post:
      tags: [urls]
      operationId: createShortUrl
      summary: Create a short URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUrlRequest"
      responses:
        "201":
          description: Short URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The requested customAlias is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [urls]
      operationId: listUrls
      summary: List the authenticated user's URLs
      responses:
        "200":
          description: List of the user's URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UrlSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /urls/bulk:
    post:
      tags: [bulk]
      operationId: createBulkUrls
      summary: Enqueue bulk URL creation (asynchronous processing)
      description: >
        Enqueues the job in RabbitMQ (bulk-url-jobs queue) and responds immediately; the Bulk
        Processor processes it out of band. Check progress with
        GET /urls/bulk/{jobId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateRequest"
      responses:
        "202":
          description: Bulk creation job accepted and enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /urls/bulk/{jobId}:
    get:
      tags: [bulk]
      operationId: getBulkJobStatus
      summary: Check the status of a bulk creation job
      parameters:
        - $ref: "#/components/parameters/JobIdPathParam"
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /urls/{shortCode}:
    delete:
      tags: [urls]
      operationId: deleteUrl
      summary: Revoke (deactivate) one of your own short URLs
      parameters:
        - $ref: "#/components/parameters/ShortCodePathParam"
      responses:
        "204":
          description: URL revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /urls/{shortCode}/analytics:
    get:
      tags: [urls]
      operationId: getUrlAnalytics
      summary: Aggregated click metrics for one of your own URLs
      parameters:
        - $ref: "#/components/parameters/ShortCodePathParam"
      responses:
        "200":
          description: Aggregated metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC token issued by Keycloak. The V2 services act as an OAuth2 Resource
        Server (see ARCHITECTURE.md, section 5) — they do not validate credentials on their own.

  parameters:
    ShortCodePathParam:
      name: shortCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z]{6,20}$'
    JobIdPathParam:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The resource exists but does not belong to the authenticated user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RedirectRule:
      type: object
      description: >
        Simple conditional redirect by device type (see ARCHITECTURE.md,
        section 6, Scenario C — "smart" was disambiguated as this, deliberately
        scoped down instead of a generic rules engine).
      required: [deviceType, targetUrl]
      properties:
        deviceType:
          type: string
          enum: [MOBILE, DESKTOP, DEFAULT]
        targetUrl:
          type: string
          format: uri

    CreateUrlRequest:
      type: object
      required: [longUrl]
      properties:
        longUrl:
          type: string
          format: uri
        customAlias:
          type: string
          nullable: true
          pattern: '^[0-9A-Za-z_-]{3,20}$'
          description: Alias chosen by the user; if omitted, one is generated with Base62.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        redirectRules:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RedirectRule"

    CreateUrlResponse:
      type: object
      properties:
        shortCode:
          type: string
        shortUrl:
          type: string
          format: uri
        ownerId:
          type: string

    UrlSummary:
      type: object
      properties:
        shortCode:
          type: string
        longUrl:
          type: string
          format: uri
        shortUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean

    BulkCreateRequestItem:
      type: object
      required: [longUrl]
      properties:
        longUrl:
          type: string
          format: uri
        customAlias:
          type: string
          nullable: true

    BulkCreateRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BulkCreateRequestItem"

    BulkJobAccepted:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING]
        totalItems:
          type: integer

    BulkJobItem:
      type: object
      properties:
        lineIndex:
          type: integer
        longUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [PENDING, DONE, FAILED]
        shortCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true

    BulkJobStatus:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]
        totalItems:
          type: integer
        processedItems:
          type: integer
        failedItems:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BulkJobItem"

    UrlAnalytics:
      type: object
      properties:
        shortCode:
          type: string
        totalClicks:
          type: integer
          format: int64
        clicksByDay:
          type: object
          description: Map of date (YYYY-MM-DD) -> number of clicks that day
          additionalProperties:
            type: integer
        topReferrers:
          type: array
          items:
            type: string
        topDeviceTypes:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
